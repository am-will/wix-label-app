<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wix Label Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #f9fafb;
      color: #111827;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- TOP BAR ---- */
    .topbar {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }
    .topbar h1 {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }
    .topbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      -webkit-app-region: no-drag;
    }
    .search-input {
      width: 240px;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: #111827;
    }
    .search-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.12);
    }

    /* ---- BUTTONS ---- */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover { filter: brightness(0.95); }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #dc2626; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-success { background: #059669; color: #fff; }
    .btn-outline {
      background: transparent;
      border: 1px solid #d1d5db;
      color: #374151;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-lg { padding: 12px 24px; font-size: 15px; }

    /* ---- LAYOUT ---- */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 380px;
      min-width: 360px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      padding: 20px;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .preview-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f3f4f6;
    }

    /* ---- SIDEBAR SECTIONS ---- */
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3af;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }

    /* ---- FORM CONTROLS ---- */
    .form-group { margin-bottom: 12px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    .form-group input[type="text"],
    .form-group input[type="password"],
    .form-group input[type="number"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: #111827;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #dc2626;
      box-shadow: 0 0 0 2px rgba(220,38,38,0.1);
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .toggle-row span { font-size: 13px; color: #374151; }
    .toggle {
      width: 40px; height: 22px;
      background: #d1d5db;
      border-radius: 11px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.active { background: #dc2626; }
    .toggle::after {
      content: '';
      width: 18px; height: 18px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 2px; left: 2px;
      transition: left 0.2s;
    }
    .toggle.active::after { left: 20px; }
    .schedule-times {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .time-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      font-size: 12px;
      color: #dc2626;
      font-weight: 600;
    }
    .time-chip .remove {
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    /* ---- STATUS BAR ---- */
    .status-bar {
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      padding: 8px 24px;
      font-size: 12px;
      color: #6b7280;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.green { background: #059669; }
    .status-dot.yellow { background: #f59e0b; }
    .status-dot.red { background: #dc2626; }

    /* ---- EMPTY STATE ---- */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #9ca3af;
      text-align: center;
      gap: 12px;
    }
    .empty-state .icon { font-size: 48px; }
    .empty-state p { font-size: 14px; max-width: 300px; }

    /* ---- STATS ROW ---- */
    .stats-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stat-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .stat-delivery { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .stat-pickup { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .stat-total { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }

    /* ---- LOADING ---- */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #e5e7eb;
      border-top-color: #dc2626;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- TABS (for settings sections) ---- */
    .tab-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 12px;
    }
    .tab-btn {
      width: 100%;
      padding: 6px 8px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      cursor: pointer;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-btn.active { background: #fef2f2; color: #dc2626; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ---- NOTIFICATION TOAST ---- */
    .toast {
      position: fixed;
      bottom: 60px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      z-index: 999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #059669; }
    .toast.error { background: #dc2626; }
    .toast.info { background: #2563eb; }
    .toast-content {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 620px;
    }
    .toast-text {
      overflow-wrap: anywhere;
    }
    .toast-action {
      border: 1px solid rgba(255,255,255,0.65);
      background: rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toast-action:hover {
      background: rgba(255,255,255,0.3);
    }

    .order-hit {
      box-shadow: 0 0 0 3px rgba(37,99,235,0.45), 0 6px 18px rgba(37,99,235,0.25);
      transition: box-shadow 0.2s;
    }
    .preview-order-wrap {
      width: 480px;
      margin: 20px auto;
    }
    .label-select-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 6px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
      font-size: 12px;
      color: #374151;
      font-weight: 600;
    }
    .label-select-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #dc2626;
    }
    .orders-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 auto 10px;
      width: 480px;
      flex-wrap: wrap;
    }
    .label-row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .label-row-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .inline-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #374151;
      font-weight: 600;
    }
    .inline-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #dc2626;
    }
    .btn-xs {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }
    .edit-pill {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      padding: 2px 8px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,0.55);
      z-index: 1200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 20px 50px rgba(15,23,42,0.3);
      padding: 18px;
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
    }
    .modal-subtitle {
      font-size: 12px;
      color: #6b7280;
      margin-top: 3px;
    }
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .modal-grid-full {
      grid-column: 1 / -1;
    }
    .modal-actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    @media (max-width: 640px) {
      .modal-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- TOP BAR -->
  <div class="topbar">
    <h1>🏷️ Wix Label Generator</h1>
    <div class="topbar-actions">
      <input
        class="search-input"
        id="order-search"
        type="text"
        placeholder="Find order #, name, email..."
        onkeydown="if(event.key==='Enter') searchOrders();"
      >
      <button class="btn btn-outline" onclick="searchOrders()">Find</button>
      <button class="btn btn-primary btn-lg" id="btn-archive" onclick="archiveSelectedOrders()" disabled>
        Archive
      </button>
      <button class="btn btn-success btn-lg" id="btn-pull" onclick="pullOrders()">
        Pull Orders
      </button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <!-- Quick Stats -->
      <div id="stats-section" style="display:none;">
        <div class="section-title">Current Batch</div>
        <div class="stats-row" id="stats-row"></div>
        <div style="display:flex;gap:6px;margin-top:12px;">
          <button class="btn btn-primary" style="flex:1;" onclick="printLabels()">🖨️ Print</button>
          <button class="btn btn-secondary" style="flex:1;" onclick="savePdf()">💾 Save PDF</button>
        </div>
      </div>

      <!-- Settings Tabs -->
      <div>
        <div class="section-title">Settings</div>
        <div class="tab-row">
          <button class="tab-btn active" onclick="switchTab('connection')">Connection</button>
          <button class="tab-btn" onclick="switchTab('schedule')">Schedule</button>
          <button class="tab-btn" onclick="switchTab('printing')">Printing</button>
          <button class="tab-btn" onclick="switchTab('packs')">Packs</button>
        </div>

        <!-- Connection Tab -->
        <div class="tab-content active" id="tab-connection">
          <div class="card">
            <div class="form-group">
              <label>Order Source</label>
              <select id="order-source" onchange="updateSourceModeUI()">
                <option value="wix">Wix API</option>
                <option value="csv">CSV Import</option>
              </select>
            </div>
            <div id="wix-connection-fields" style="margin-bottom:12px;">
            <div class="form-group">
              <label>Wix API Key</label>
              <input type="password" id="wix-api-key" placeholder="Enter your Wix API key">
            </div>
            <div class="form-group">
              <label>Wix Site ID</label>
              <input type="text" id="wix-site-id" placeholder="Enter your Wix Site ID">
            </div>
            <div class="form-group">
              <label>Order Filter</label>
              <select id="order-archive-filter">
                <option value="active">Active</option>
                <option value="archived">Archived</option>
                <option value="all">All</option>
              </select>
            </div>
            </div>
            <div id="csv-connection-fields" style="display:none;">
              <div class="form-group">
                <label>CSV File</label>
                <div style="display:flex;gap:6px;">
                  <input type="text" id="csv-path" readonly style="flex:1;" placeholder="Choose Orders.csv file">
                  <button class="btn btn-outline" onclick="chooseCsvFile()">Browse</button>
                </div>
              </div>
              <button class="btn btn-outline" style="width:100%;margin-top:0;" onclick="importCsvNow()">Import CSV Now</button>
            </div>
            <div class="form-group">
              <label>Pull orders from last (days)</label>
              <input type="number" id="pull-range" value="7" min="1" max="365">
            </div>
            <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="saveAllSettings()">Save Connection</button>
          </div>
        </div>

        <!-- Schedule Tab -->
        <div class="tab-content" id="tab-schedule">
          <div class="card">
            <div class="toggle-row">
              <span>Enable auto-pull</span>
              <div class="toggle" id="toggle-schedule" onclick="toggleSchedule()"></div>
            </div>
            <div class="toggle-row">
              <span>Auto-print on pull</span>
              <div class="toggle" id="toggle-autoprint" onclick="toggleAutoPrint()"></div>
            </div>
            <div class="form-group" style="margin-top:12px;">
              <label>Scheduled Day + Time</label>
              <div style="display:flex;gap:6px;">
                <select id="new-day" style="flex:1;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
                  <option value="Monday">Monday</option>
                  <option value="Tuesday">Tuesday</option>
                  <option value="Wednesday">Wednesday</option>
                  <option value="Thursday">Thursday</option>
                  <option value="Friday">Friday</option>
                  <option value="Saturday">Saturday</option>
                  <option value="Sunday">Sunday</option>
                </select>
                <input type="time" id="new-time" style="flex:1;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
                <button class="btn btn-secondary" onclick="addScheduleTime()">Add</button>
              </div>
              <div class="schedule-times" id="schedule-times"></div>
            </div>
            <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="saveAllSettings()">Save Schedule</button>
          </div>
        </div>

        <!-- Printing Tab -->
        <div class="tab-content" id="tab-printing">
          <div class="card">
            <div class="form-group">
              <label>Printer</label>
              <select id="printer-select">
                <option value="">System Default</option>
              </select>
              <button class="btn btn-outline" style="width:100%;margin-top:6px;" onclick="refreshPrinters()">Refresh Printers</button>
            </div>
            <div class="form-group">
              <label>Default Save Folder</label>
              <div style="display:flex;gap:6px;">
                <input type="text" id="save-path" readonly style="flex:1;">
                <button class="btn btn-outline" onclick="chooseSaveDir()">Browse</button>
              </div>
            </div>
            <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="saveAllSettings()">Save Print Settings</button>
          </div>
        </div>

        <!-- Packs Tab -->
        <div class="tab-content" id="tab-packs">
          <div class="card">
            <div class="form-group">
              <label>Weight Loss Pack Keywords (comma-separated)</label>
              <input type="text" id="wl-keywords" placeholder="weight loss, wl pack">
            </div>
            <div class="form-group">
              <label>Weight Loss Pack Items (one per line)</label>
              <textarea id="wl-items" rows="5"></textarea>
            </div>
            <div class="form-group">
              <label>Weekly Pack Keywords (comma-separated)</label>
              <input type="text" id="wp-keywords" placeholder="weekly pack, weekly meal">
            </div>
            <div class="form-group">
              <label>Weekly Pack Items (one per line)</label>
              <textarea id="wp-items" rows="5"></textarea>
            </div>
            <div class="form-group">
              <label>Back On Track Box Keywords (comma-separated)</label>
              <input type="text" id="bot-keywords" placeholder="back on track, back on track box">
            </div>
            <div class="form-group">
              <label>Back On Track Box Items (one per line)</label>
              <textarea id="bot-items" rows="5"></textarea>
            </div>
            <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="saveAllSettings()">Save Pack Config</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PREVIEW AREA -->
    <div class="preview-area" id="preview-area">
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>Click <strong>Pull Orders</strong> to fetch new orders from Wix and generate labels.</p>
        <p style="font-size:12px;color:#d1d5db;">Make sure your API Key and Site ID are configured in Settings.</p>
      </div>
    </div>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div id="status-text">
      <span class="status-dot yellow"></span> Not connected
    </div>
    <div id="status-right">Ready</div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- EDIT LABEL MODAL -->
  <div class="modal-backdrop" id="edit-label-modal" onclick="if(event.target===this) closeEditLabelModal()">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-label-modal-title">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="edit-label-modal-title">Edit Label</div>
          <div class="modal-subtitle" id="edit-label-modal-subtitle"></div>
        </div>
        <button class="btn btn-outline btn-xs" onclick="closeEditLabelModal()">Close</button>
      </div>
      <div class="modal-grid">
        <div class="form-group">
          <label>Delivery Method</label>
          <select id="edit-delivery-method" onchange="onEditDeliveryMethodChange()">
            <option value="DELIVERY">Delivery</option>
            <option value="PICKUP">Pickup</option>
          </select>
        </div>
        <div class="form-group">
          <label>Location (WACO / TEMPLE / custom)</label>
          <input type="text" id="edit-location" placeholder="WACO">
        </div>
        <div class="form-group modal-grid-full" id="edit-address-group">
          <label>Shipping Address (for delivery labels)</label>
          <textarea id="edit-formatted-address" rows="4" placeholder="Street&#10;City, ST ZIP"></textarea>
        </div>
        <div class="form-group modal-grid-full">
          <label>Delivery Note</label>
          <input type="text" id="edit-delivery-note" placeholder="Leave at front desk">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="saveLabelEdit()">Save Label Edit</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // STATE
    // ============================================================
    let baseOrders = [];
    let currentOrders = [];
    let currentHtml = '';
    let appSettings = {};
    let logoDataUrl = '';
    let lastSearchQuery = '';
    let lastSearchIndex = -1;
    let selectedOrderIds = new Set();
    let labelOverrides = {};
    let activeEditOrderIndex = -1;

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
      appSettings = await window.api.getSettings();
      logoDataUrl = await window.api.getLogoDataUrl() || '';
      labelOverrides = sanitizeLabelOverrides(appSettings.labelOverrides);
      populateSettings();
      refreshPrinters();

      // Listen for scheduled pulls
      window.api.onScheduledPull(async () => {
        showToast('Scheduled pull triggered...', 'info');
        await pullOrders();
        if (appSettings.autoPrint && currentOrders.length > 0) {
          await printLabels();
        }
      });
    }

    const EDITABLE_LABEL_FIELDS = ['deliveryMethod', 'location', 'formattedAddress', 'deliveryNote'];

    function normalizeText(value) {
      return String(value || '').replace(/\r\n/g, '\n').trim();
    }

    function normalizeDeliveryMethod(value, fallback = 'DELIVERY') {
      const normalized = String(value || fallback).toUpperCase().trim();
      return normalized === 'PICKUP' ? 'PICKUP' : 'DELIVERY';
    }

    function normalizeLocation(value) {
      return String(value || '').trim().toUpperCase();
    }

    function normalizeFieldValue(field, value) {
      if (field === 'deliveryMethod') return normalizeDeliveryMethod(value);
      if (field === 'location') return normalizeLocation(value);
      return normalizeText(value);
    }

    function sanitizeLabelOverrides(rawOverrides) {
      if (!rawOverrides || typeof rawOverrides !== 'object') return {};
      const clean = {};

      Object.entries(rawOverrides).forEach(([key, value]) => {
        const normalizedKey = String(key || '').trim();
        if (!normalizedKey || !value || typeof value !== 'object') return;

        const sanitizedEntry = {};
        EDITABLE_LABEL_FIELDS.forEach((field) => {
          if (!Object.prototype.hasOwnProperty.call(value, field)) return;
          sanitizedEntry[field] = normalizeFieldValue(field, value[field]);
        });

        if (Object.keys(sanitizedEntry).length) {
          clean[normalizedKey] = sanitizedEntry;
        }
      });

      return clean;
    }

    function getOrderOverrideKey(order) {
      return String(
        order?.orderId ||
        `${order?.orderNumber || ''}::${order?.createdDate || ''}::${order?.customerEmail || ''}::${order?.customerName || ''}`
      ).trim();
    }

    function mergeOrderWithOverride(order) {
      const key = getOrderOverrideKey(order);
      const override = labelOverrides[key];
      if (!override) return { ...order };

      const merged = { ...order };
      EDITABLE_LABEL_FIELDS.forEach((field) => {
        if (!Object.prototype.hasOwnProperty.call(override, field)) return;
        merged[field] = normalizeFieldValue(field, override[field]);
      });

      merged.deliveryMethod = normalizeDeliveryMethod(merged.deliveryMethod, order.deliveryMethod);
      merged.location = normalizeLocation(merged.location);
      merged.formattedAddress = normalizeText(merged.formattedAddress);
      merged.deliveryNote = normalizeText(merged.deliveryNote);
      return merged;
    }

    function buildDisplayOrders(orders) {
      return (orders || []).map((order) => mergeOrderWithOverride(order));
    }

    function hasOrderOverride(order) {
      return !!labelOverrides[getOrderOverrideKey(order)];
    }

    async function persistLabelOverrides() {
      appSettings = await window.api.saveSettings({ labelOverrides });
      labelOverrides = sanitizeLabelOverrides(appSettings.labelOverrides);
    }

    function populateSettings() {
      document.getElementById('order-source').value = appSettings.orderSourceMode || 'wix';
      document.getElementById('wix-api-key').value = appSettings.wixApiKey || '';
      document.getElementById('wix-site-id').value = appSettings.wixSiteId || '';
      document.getElementById('csv-path').value = appSettings.csvPath || '';
      document.getElementById('pull-range').value = appSettings.pullRangeDays || 7;
      document.getElementById('order-archive-filter').value = appSettings.orderArchiveFilter || 'active';
      document.getElementById('save-path').value = appSettings.savePath || '';

      // Schedule
      const toggleEl = document.getElementById('toggle-schedule');
      if (appSettings.autoSchedule) toggleEl.classList.add('active');
      const toggleAp = document.getElementById('toggle-autoprint');
      if (appSettings.autoPrint) toggleAp.classList.add('active');
      renderScheduleTimes();

      // Packs
      document.getElementById('wl-keywords').value = (appSettings.weightLossKeywords || []).join(', ');
      document.getElementById('wl-items').value = (appSettings.weightLossItems || []).join('\n');
      document.getElementById('wp-keywords').value = (appSettings.weeklyPackKeywords || []).join(', ');
      document.getElementById('wp-items').value = (appSettings.weeklyPackItems || []).join('\n');
      document.getElementById('bot-keywords').value = (appSettings.backOnTrackKeywords || []).join(', ');
      document.getElementById('bot-items').value = (appSettings.backOnTrackItems || []).join('\n');

      updateSourceModeUI();
      refreshConnectionStatus();
    }

    // ============================================================
    // PULL ORDERS
    // ============================================================
    async function pullOrders() {
      const btn = document.getElementById('btn-pull');
      const archiveBtn = document.getElementById('btn-archive');
      btn.disabled = true;
      archiveBtn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Pulling...';
      document.getElementById('status-right').textContent = 'Fetching orders...';

      try {
        closeEditLabelModal();
        baseOrders = await window.api.pullOrders();
        currentOrders = buildDisplayOrders(baseOrders);
        selectedOrderIds = new Set(currentOrders.map((o) => String(o.orderId || '')).filter(Boolean));

        if (currentOrders.length === 0) {
          const source = (appSettings.orderSourceMode || 'wix') === 'csv' ? 'CSV file' : 'Wix';
          document.getElementById('preview-area').innerHTML = `
            <div class="empty-state">
              <div class="icon">✅</div>
              <p>No orders found from ${source} in the last ${appSettings.pullRangeDays || 7} days.</p>
            </div>`;
          document.getElementById('stats-section').style.display = 'none';
          selectedOrderIds = new Set();
          showToast('No new orders found', 'info');
        } else {
          renderLabels();
          showToast(`Pulled ${currentOrders.length} order(s)`, 'success');
        }

        document.getElementById('status-right').textContent =
          `Last pull: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        showToast(err.message, 'error');
        document.getElementById('status-right').textContent = 'Pull failed';
      }

      btn.disabled = false;
      btn.innerHTML = 'Pull Orders';
      updateArchiveButtonState();
    }

    // ============================================================
    // LABEL HTML GENERATION
    // ============================================================
    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleDateString('en-US', {
          weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
          hour: 'numeric', minute: '2-digit', hour12: true
        });
      } catch { return iso; }
    }

    function getOrderLabelId(order) {
      const seed = String(order.orderId || order.orderNumber || order.customerName || 'order');
      return 'order-label-' + seed.replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    const CONFIG = {
      DELIVERY: { color: '#dc2626', label: 'DELIVERY' },
      PICKUP:   { color: '#059669', label: 'PICKUP' },
      WEIGHT_LOSS_PACK: { color: '#dc2626', label: 'Weight Loss Pack', bg: '#fef2f2', border: '#fecaca' },
      WEEKLY_PACK:      { color: '#7c3aed', label: 'Weekly Pack',      bg: '#f5f3ff', border: '#ddd6fe' },
      BACK_ON_TRACK_PACK:{ color: '#2563eb', label: 'Back On Track Box', bg: '#eff6ff', border: '#bfdbfe' },
      CUSTOM:           { color: '#d97706', label: 'Custom Order',     bg: '#fffbeb', border: '#fde68a' }
    };

    function generateLabelHtml(order, options = {}) {
      const forPrint = !!options.forPrint;
      const dm = CONFIG[order.deliveryMethod] || CONFIG.DELIVERY;
      const ot = CONFIG[order.orderType] || CONFIG.CUSTOM;
      const isDelivery = order.deliveryMethod === 'DELIVERY';

      const itemRows = order.items.map((item, i) => {
        const isLast = i === order.items.length - 1;
        const border = isLast ? '' : 'border-bottom:1px solid #f0f0f0;';
        const optCell = item.option
          ? `<td style="padding:6px 8px;color:#6b7280;font-size:12px;${border}">${escapeHtml(item.option)}</td>`
          : `<td style="padding:6px 8px;${border}"></td>`;
        return `<tr>
          <td style="padding:6px 0;color:#374151;${border}">${escapeHtml(item.name)}</td>
          ${optCell}
          <td style="padding:6px 0;color:#374151;text-align:right;white-space:nowrap;${border}">x ${item.qty}</td>
        </tr>`;
      }).join('');

      let addressBlock = '';
      if (isDelivery && order.formattedAddress) {
        const lines = order.formattedAddress.split('\n').map(l => escapeHtml(l)).join('<br>');
        const note = order.deliveryNote
          ? `<div style="font-size:13px;color:#dc2626;font-weight:600;margin-top:6px;">${escapeHtml(order.deliveryNote)}</div>`
          : '';
        addressBlock = `
          <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;margin-bottom:18px;">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#991b1b;font-weight:700;margin-bottom:6px;">Shipping Address</div>
            <div style="font-size:14px;color:#1f2937;line-height:1.5;">
              ${escapeHtml(order.customerName)}<br>${lines}
            </div>
            ${note}
          </div>`;
      } else {
        addressBlock = '';
      }

      const locationHtml = order.location
        ? `<span style="color:#ffffff;font-size:14px;font-weight:700;letter-spacing:1px;">${escapeHtml(order.location)}</span>`
        : '';
      const logoHtml = logoDataUrl
        ? `<img src="${logoDataUrl}" alt="Fuel Up logo" style="max-height:56px;max-width:180px;object-fit:contain;">`
        : '';
      const labelId = getOrderLabelId(order);
      const outerStyle = forPrint
        ? `width:calc(100% - 2px);border:3px solid ${dm.color};border-radius:10px;padding:0;margin:0 0 0.16in 0;font-family:'Segoe UI',Arial,sans-serif;background:#ffffff;overflow:hidden;break-inside:avoid;page-break-inside:avoid;-webkit-column-break-inside:avoid;display:block;vertical-align:top;box-sizing:border-box;zoom:0.8;`
        : `width:480px;border:3px solid ${dm.color};border-radius:10px;padding:0;margin:24px auto;font-family:'Segoe UI',Arial,sans-serif;background:#ffffff;page-break-inside:avoid;overflow:hidden;zoom:0.8;`;

      return `
        <div id="${labelId}" class="label-card" style="${outerStyle}">
          <div style="background:${dm.color};padding:6px 20px;display:flex;justify-content:space-between;align-items:center;">
            <span style="color:#ffffff;font-size:14px;font-weight:700;letter-spacing:1px;">${dm.label}</span>
            ${locationHtml}
          </div>
          <div style="padding:20px 24px 24px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid #e5e7eb;">
              <div style="min-width:0;flex:1;">
                <div style="font-size:34px;font-weight:800;color:#dc2626;text-transform:uppercase;line-height:1.05;margin-bottom:2px;">${escapeHtml(order.customerName)}</div>
                <div style="font-size:18px;font-weight:700;color:#111827;">Order #${escapeHtml(order.orderNumber)} (${order.totalItemCount} items)</div>
                <div style="font-size:12px;color:#6b7280;margin-top:4px;">${formatDate(order.createdDate)}</div>
              </div>
              <div style="flex-shrink:0;display:flex;justify-content:flex-end;">
                ${logoHtml}
              </div>
            </div>
            <div style="font-size:13px;color:#6b7280;margin-bottom:16px;">
              ${escapeHtml(order.customerName)}${order.customerEmail ? ' | ' + escapeHtml(order.customerEmail) : ''}${order.customerPhone ? ' | ' + escapeHtml(order.customerPhone) : ''}
            </div>
            ${addressBlock}
            <div style="display:block;width:100%;box-sizing:border-box;padding:5px 14px;border-radius:6px;background:${ot.bg};border:1px solid ${ot.border};margin-bottom:16px;">
              <span style="font-size:13px;font-weight:700;color:${ot.color};">${ot.label}</span>
            </div>
            <div style="margin-bottom:4px;">
              <table style="width:100%;border-collapse:collapse;font-size:13px;">${itemRows}</table>
            </div>
            <div style="border-top:2px solid #e5e7eb;padding-top:8px;margin-top:4px;">
              <div style="display:flex;justify-content:flex-end;font-size:13px;color:#6b7280;gap:24px;">
                <span>Subtotal: $${order.subtotal}</span>
                <span>Shipping: $${order.shipping}</span>
                <span style="font-weight:700;color:#111827;">Total: $${order.total}</span>
              </div>
            </div>
          </div>
        </div>`;
    }

    function buildFullDocument(orders) {
      const labels = orders.map(o => generateLabelHtml(o, { forPrint: true })).join('');

      return `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @page { size: letter portrait; margin: 0.35in; }
  body { margin:0; padding:0; background:#fff; font-family:'Segoe UI',Arial,sans-serif; }
  .labels-columns {
    column-count: 2;
    column-gap: 0.16in;
    column-fill: auto;
    padding-right: 0.03in;
  }
  .label-card {
    break-inside: avoid;
    page-break-inside: avoid;
    -webkit-column-break-inside: avoid;
    width: 100%;
    box-sizing: border-box;
    margin: 0 0 0.16in 0;
  }
</style></head><body>
  <div class="labels-columns">${labels}</div>
</body></html>`;
    }

    function generateOrderPreviewHtml(order, index) {
      const orderId = String(order.orderId || '');
      const isChecked = selectedOrderIds.has(orderId);
      const checkboxId = `archive-check-${String(index)}`;
      const isEdited = hasOrderOverride(order);

      return `
        <div class="preview-order-wrap">
          <div class="label-select-row">
            <div class="label-row-left">
              <span>Order #${escapeHtml(order.orderNumber || '')}</span>
              ${isEdited ? '<span class="edit-pill">Edited</span>' : ''}
            </div>
            <div class="label-row-actions">
              <button class="btn btn-outline btn-xs" onclick="openEditLabelModal(${index})">Edit Label</button>
              <button class="btn btn-outline btn-xs" onclick="resetLabelOverrideByIndex(${index})" ${isEdited ? '' : 'disabled'}>Reset</button>
              <label class="inline-check" for="${checkboxId}">
                Archive
                <input
                  id="${checkboxId}"
                  type="checkbox"
                  ${isChecked ? 'checked' : ''}
                  onchange="toggleOrderSelectionByIndex(${index}, this.checked)"
                >
              </label>
            </div>
          </div>
          ${generateLabelHtml(order)}
        </div>
      `;
    }

    function onEditDeliveryMethodChange() {
      const method = normalizeDeliveryMethod(document.getElementById('edit-delivery-method').value);
      document.getElementById('edit-address-group').style.display = method === 'DELIVERY' ? 'block' : 'none';
    }

    function openEditLabelModal(index) {
      const order = currentOrders[index];
      if (!order) return;
      activeEditOrderIndex = index;
      document.getElementById('edit-label-modal-title').textContent = `Edit Label #${order.orderNumber || ''}`;
      document.getElementById('edit-label-modal-subtitle').textContent =
        `Wix order stays unchanged. This only edits the printed label.`;
      document.getElementById('edit-delivery-method').value = normalizeDeliveryMethod(order.deliveryMethod);
      document.getElementById('edit-location').value = order.location || '';
      document.getElementById('edit-formatted-address').value = order.formattedAddress || '';
      document.getElementById('edit-delivery-note').value = order.deliveryNote || '';
      onEditDeliveryMethodChange();
      document.getElementById('edit-label-modal').classList.add('open');
    }

    function closeEditLabelModal() {
      activeEditOrderIndex = -1;
      document.getElementById('edit-label-modal').classList.remove('open');
    }

    function buildOrderOverride(baseOrder, draftOrder) {
      const override = {};
      EDITABLE_LABEL_FIELDS.forEach((field) => {
        const baseValue = normalizeFieldValue(field, baseOrder[field]);
        const draftValue = normalizeFieldValue(field, draftOrder[field]);
        if (draftValue !== baseValue) {
          override[field] = draftValue;
        }
      });
      return override;
    }

    async function saveLabelEdit() {
      if (activeEditOrderIndex < 0 || activeEditOrderIndex >= currentOrders.length) return;
      const baseOrder = baseOrders[activeEditOrderIndex];
      if (!baseOrder) return;

      const draft = {
        deliveryMethod: normalizeDeliveryMethod(document.getElementById('edit-delivery-method').value, baseOrder.deliveryMethod),
        location: normalizeLocation(document.getElementById('edit-location').value),
        formattedAddress: normalizeText(document.getElementById('edit-formatted-address').value),
        deliveryNote: normalizeText(document.getElementById('edit-delivery-note').value)
      };

      if (draft.deliveryMethod === 'DELIVERY' && !draft.location) {
        showToast('Delivery labels must include a location (ex: WACO or TEMPLE).', 'error');
        return;
      }

      const key = getOrderOverrideKey(baseOrder);
      const override = buildOrderOverride(baseOrder, draft);
      if (Object.keys(override).length) {
        labelOverrides[key] = override;
      } else {
        delete labelOverrides[key];
      }

      currentOrders = buildDisplayOrders(baseOrders);
      renderLabels();
      await persistLabelOverrides();
      closeEditLabelModal();
      showToast('Label edit saved.', 'success');
    }

    async function resetLabelOverrideByIndex(index) {
      const baseOrder = baseOrders[index];
      if (!baseOrder) return;
      const key = getOrderOverrideKey(baseOrder);
      if (!labelOverrides[key]) return;
      delete labelOverrides[key];
      currentOrders = buildDisplayOrders(baseOrders);
      renderLabels();
      await persistLabelOverrides();
      showToast('Label reset to Wix values.', 'info');
    }

    // ============================================================
    // RENDER PREVIEW
    // ============================================================
    function renderLabels() {
      const deliveryCount = currentOrders.filter(o => o.deliveryMethod === 'DELIVERY').length;
      const pickupCount = currentOrders.filter(o => o.deliveryMethod === 'PICKUP').length;

      // Stats
      document.getElementById('stats-section').style.display = 'block';
      document.getElementById('stats-row').innerHTML = `
        <span class="stat-badge stat-total">${currentOrders.length} total</span>
        <span class="stat-badge stat-delivery">🚚 ${deliveryCount} delivery</span>
        <span class="stat-badge stat-pickup">📦 ${pickupCount} pickup</span>
      `;

      // Build HTML
      currentHtml = buildFullDocument(currentOrders);

      // Render preview (individual cards, not the full print document)
      const controlsHtml = `
        <div class="orders-toolbar">
          <span class="stat-badge stat-total">☑️ ${getSelectedOrderCount()} selected</span>
          <button class="btn btn-outline" onclick="selectAllOrders()">Select All</button>
          <button class="btn btn-outline" onclick="deselectAllOrders()">Deselect All</button>
        </div>
      `;
      const previewHtml = currentOrders.map((o, idx) => generateOrderPreviewHtml(o, idx)).join('');
      document.getElementById('preview-area').innerHTML = controlsHtml + previewHtml;
      updateArchiveButtonState();
    }

    function getSelectedArchivableOrderIds() {
      const isWixMode = (appSettings.orderSourceMode || 'wix') === 'wix';
      if (!isWixMode) return [];
      return currentOrders
        .map((order) => String(order.orderId || '').trim())
        .filter((id) => id && selectedOrderIds.has(id));
    }

    function getSelectableOrderIds() {
      return currentOrders
        .map((order) => String(order.orderId || '').trim())
        .filter(Boolean);
    }

    function getSelectedOrderCount() {
      const selectable = new Set(getSelectableOrderIds());
      let count = 0;
      selectedOrderIds.forEach((id) => {
        if (selectable.has(id)) count += 1;
      });
      return count;
    }

    function toggleOrderSelectionByIndex(index, checked) {
      const order = currentOrders[index];
      const normalized = String(order?.orderId || '').trim();
      if (!normalized) return;
      if (checked) {
        selectedOrderIds.add(normalized);
      } else {
        selectedOrderIds.delete(normalized);
      }
      updateArchiveButtonState();
      if (currentOrders.length > 0) {
        renderLabels();
      }
    }

    function selectAllOrders() {
      selectedOrderIds = new Set(getSelectableOrderIds());
      if (currentOrders.length > 0) {
        renderLabels();
      } else {
        updateArchiveButtonState();
      }
    }

    function deselectAllOrders() {
      selectedOrderIds = new Set();
      if (currentOrders.length > 0) {
        renderLabels();
      } else {
        updateArchiveButtonState();
      }
    }

    function updateArchiveButtonState() {
      const btn = document.getElementById('btn-archive');
      if (!btn) return;
      const selectedIds = getSelectedArchivableOrderIds();
      const isEnabled = selectedIds.length > 0;
      btn.disabled = !isEnabled;
      btn.textContent = isEnabled ? `Archive (${selectedIds.length})` : 'Archive';
    }

    async function archiveSelectedOrders() {
      const selectedIds = getSelectedArchivableOrderIds();
      if (!selectedIds.length) {
        showToast('No Wix orders selected to archive.', 'info');
        return;
      }

      const btn = document.getElementById('btn-archive');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Archiving...';

      try {
        const result = await window.api.archiveOrders(selectedIds);
        const successCount = Number(result?.successCount || 0);
        const failedCount = Number(result?.failedCount || 0);

        if (failedCount === 0) {
          currentOrders = currentOrders.filter((order) => !selectedIds.includes(String(order.orderId || '').trim()));
          selectedOrderIds = new Set(currentOrders.map((o) => String(o.orderId || '')).filter(Boolean));

          if (!currentOrders.length) {
            document.getElementById('preview-area').innerHTML = `
              <div class="empty-state">
                <div class="icon">✅</div>
                <p>No orders left in the current batch.</p>
              </div>`;
            document.getElementById('stats-section').style.display = 'none';
          } else {
            renderLabels();
          }
        } else {
          renderLabels();
        }

        if (failedCount > 0) {
          showToast(`Archived ${successCount} order(s), ${failedCount} failed.`, 'error');
        } else {
          showToast(`Archived ${successCount} order(s).`, 'success');
        }
      } catch (err) {
        showToast('Archive failed: ' + err.message, 'error');
      }

      btn.innerHTML = 'Archive';
      updateArchiveButtonState();
    }

    function clearOrderHighlights() {
      document.querySelectorAll('.order-hit').forEach(el => el.classList.remove('order-hit'));
    }

    function getOrderSearchText(order) {
      const packLabelByType = {
        WEIGHT_LOSS_PACK: 'weight loss pack weight loss',
        WEEKLY_PACK: 'weekly pack weekly',
        BACK_ON_TRACK_PACK: 'back on track box back on track',
        CUSTOM: 'custom order',
        DELIVERY: 'delivery',
        PICKUP: 'pickup'
      };

      const itemText = (order.items || [])
        .map(i => `${i.name || ''} ${i.option || ''}`)
        .join(' ');

      return [
        order.orderNumber,
        order.customerName,
        order.customerEmail,
        order.customerPhone,
        order.location,
        order.deliveryMethod,
        order.orderType,
        packLabelByType[order.orderType] || '',
        order.formattedAddress,
        itemText
      ].join(' ').toLowerCase();
    }

    function searchOrders() {
      if (!currentOrders.length) {
        showToast('Pull orders first, then search.', 'info');
        return;
      }

      const query = (document.getElementById('order-search').value || '').trim().toLowerCase();
      if (!query) {
        showToast('Enter an order number or customer detail to search.', 'info');
        return;
      }

      const matches = currentOrders.filter(order => getOrderSearchText(order).includes(query));
      if (!matches.length) {
        clearOrderHighlights();
        lastSearchQuery = '';
        lastSearchIndex = -1;
        showToast('No matching order found in current batch.', 'error');
        return;
      }

      if (lastSearchQuery !== query) {
        lastSearchQuery = query;
        lastSearchIndex = 0;
      } else {
        lastSearchIndex = (lastSearchIndex + 1) % matches.length;
      }

      const foundOrder = matches[lastSearchIndex];
      const targetId = getOrderLabelId(foundOrder);
      const targetEl = document.getElementById(targetId);
      if (!targetEl) {
        showToast('Match found, but label is not visible yet.', 'error');
        return;
      }

      clearOrderHighlights();
      targetEl.classList.add('order-hit');
      targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      showToast(`Match ${lastSearchIndex + 1}/${matches.length}: order #${foundOrder.orderNumber}`, 'success');
    }

    // ============================================================
    // PRINT & SAVE
    // ============================================================
    async function printLabels() {
      if (!currentHtml || !currentOrders.length) {
        showToast('No labels to print. Pull orders first.', 'error');
        return;
      }
      try {
        const printerName = document.getElementById('printer-select').value || undefined;
        await window.api.printLabels({ html: currentHtml, printerName });
        showToast('Print dialog opened.', 'success');
      } catch (err) {
        showToast('Print failed: ' + err.message, 'error');
      }
    }

    async function savePdf() {
      if (!currentHtml || !currentOrders.length) {
        showToast('No labels to save. Pull orders first.', 'error');
        return;
      }
      try {
        const now = new Date();
        const name = `order-labels-${now.toISOString().split('T')[0]}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.pdf`;
        const result = await window.api.savePdf({ html: currentHtml, suggestedName: name });
        if (result) {
          showToast(`Saved: ${result}`, 'success', {
            actionLabel: 'Open',
            onAction: async () => {
              const opened = await window.api.openPath(result);
              if (!opened) {
                showToast('Could not open the saved file path.', 'error');
              }
            },
            duration: 9000
          });
        }
      } catch (err) {
        showToast('Save failed: ' + err.message, 'error');
      }
    }

    // ============================================================
    // SETTINGS
    // ============================================================
    function refreshConnectionStatus() {
      const mode = document.getElementById('order-source').value || 'wix';
      const statusEl = document.getElementById('status-text');

      if (mode === 'csv') {
        if ((appSettings.csvPath || '').trim()) {
          statusEl.innerHTML = '<span class="status-dot green"></span> CSV source ready';
        } else {
          statusEl.innerHTML = '<span class="status-dot yellow"></span> CSV source not set';
        }
        return;
      }

      if ((appSettings.wixApiKey || '').trim() && (appSettings.wixSiteId || '').trim()) {
        statusEl.innerHTML = '<span class="status-dot green"></span> Connected to Wix';
      } else {
        statusEl.innerHTML = '<span class="status-dot yellow"></span> Wix credentials missing';
      }
    }

    function updateSourceModeUI() {
      const mode = document.getElementById('order-source').value || 'wix';
      document.getElementById('wix-connection-fields').style.display = mode === 'wix' ? 'block' : 'none';
      document.getElementById('csv-connection-fields').style.display = mode === 'csv' ? 'block' : 'none';
      refreshConnectionStatus();
      updateArchiveButtonState();
    }

    async function saveAllSettings(showSavedToast = true) {
      const newSettings = {
        orderSourceMode: document.getElementById('order-source').value || 'wix',
        csvPath: document.getElementById('csv-path').value.trim(),
        wixApiKey: document.getElementById('wix-api-key').value.trim(),
        wixSiteId: document.getElementById('wix-site-id').value.trim(),
        pullRangeDays: parseInt(document.getElementById('pull-range').value) || 7,
        orderArchiveFilter: document.getElementById('order-archive-filter').value || 'active',
        savePath: document.getElementById('save-path').value,
        autoSchedule: document.getElementById('toggle-schedule').classList.contains('active'),
        autoPrint: document.getElementById('toggle-autoprint').classList.contains('active'),
        scheduleEntries: appSettings.scheduleEntries || [],
        labelOverrides,
        weightLossKeywords: document.getElementById('wl-keywords').value.split(',').map(s => s.trim()).filter(Boolean),
        weeklyPackKeywords: document.getElementById('wp-keywords').value.split(',').map(s => s.trim()).filter(Boolean),
        backOnTrackKeywords: document.getElementById('bot-keywords').value.split(',').map(s => s.trim()).filter(Boolean),
        weightLossItems: document.getElementById('wl-items').value.split('\n').map(s => s.trim()).filter(Boolean),
        weeklyPackItems: document.getElementById('wp-items').value.split('\n').map(s => s.trim()).filter(Boolean),
        backOnTrackItems: document.getElementById('bot-items').value.split('\n').map(s => s.trim()).filter(Boolean)
      };

      appSettings = await window.api.saveSettings(newSettings);
      labelOverrides = sanitizeLabelOverrides(appSettings.labelOverrides);
      populateSettings();
      if (showSavedToast) showToast('Settings saved!', 'success');
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function toggleSchedule() {
      document.getElementById('toggle-schedule').classList.toggle('active');
    }
    function toggleAutoPrint() {
      document.getElementById('toggle-autoprint').classList.toggle('active');
    }

    function addScheduleTime() {
      const input = document.getElementById('new-time');
      const day = document.getElementById('new-day').value;
      const time = input.value;
      if (!time) return;
      if (!appSettings.scheduleEntries) appSettings.scheduleEntries = [];
      const duplicate = appSettings.scheduleEntries.some((entry) => entry.day === day && entry.time === time);
      if (!duplicate) {
        appSettings.scheduleEntries.push({ day, time });
        appSettings.scheduleEntries.sort((a, b) => {
          if (a.day === b.day) return a.time.localeCompare(b.time);
          return a.day.localeCompare(b.day);
        });
        renderScheduleTimes();
      }
      input.value = '';
    }

    function removeScheduleTime(index) {
      appSettings.scheduleEntries = (appSettings.scheduleEntries || []).filter((_, i) => i !== index);
      renderScheduleTimes();
    }

    function renderScheduleTimes() {
      const container = document.getElementById('schedule-times');
      const entries = appSettings.scheduleEntries || [];
      container.innerHTML = entries.map((entry, idx) =>
        `<span class="time-chip">${entry.day} ${entry.time} <span class="remove" onclick="removeScheduleTime(${idx})">×</span></span>`
      ).join('');
    }

    async function refreshPrinters() {
      try {
        const printers = await window.api.getPrinters();
        const select = document.getElementById('printer-select');
        select.innerHTML = '<option value="">System Default</option>';
        printers.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.textContent = p.displayName + (p.isDefault ? ' (default)' : '');
          select.appendChild(opt);
        });
      } catch (e) {
        console.error('Failed to get printers:', e);
      }
    }

    async function chooseSaveDir() {
      const dir = await window.api.chooseDirectory();
      if (dir) {
        document.getElementById('save-path').value = dir;
      }
    }

    async function chooseCsvFile() {
      const csvFile = await window.api.chooseCsvFile();
      if (!csvFile) return;

      document.getElementById('csv-path').value = csvFile;
      document.getElementById('order-source').value = 'csv';
      updateSourceModeUI();
      await saveAllSettings();
    }

    async function importCsvNow() {
      if (!document.getElementById('csv-path').value.trim()) {
        const csvFile = await window.api.chooseCsvFile();
        if (!csvFile) return;
        document.getElementById('csv-path').value = csvFile;
      }
      document.getElementById('order-source').value = 'csv';
      updateSourceModeUI();
      await saveAllSettings(false);
      await pullOrders();
    }

    // ============================================================
    // TOAST NOTIFICATIONS
    // ============================================================
    let toastTimer = null;
    function showToast(msg, type = 'info', options = {}) {
      const toast = document.getElementById('toast');
      const actionLabel = options.actionLabel || '';
      const toastText = escapeHtml(msg);
      toast.innerHTML = actionLabel
        ? `<div class="toast-content"><span class="toast-text">${toastText}</span><button class="toast-action" id="toast-action">${escapeHtml(actionLabel)}</button></div>`
        : `<div class="toast-content"><span class="toast-text">${toastText}</span></div>`;
      toast.className = `toast ${type} show`;
      if (actionLabel && typeof options.onAction === 'function') {
        const actionBtn = document.getElementById('toast-action');
        if (actionBtn) {
          actionBtn.onclick = options.onAction;
        }
      }
      if (toastTimer) clearTimeout(toastTimer);
      const duration = Number.isFinite(options.duration) ? options.duration : 3500;
      toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // ============================================================
    // BOOT
    // ============================================================
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeEditLabelModal();
      }
    });

    init();
  </script>
</body>
</html>
